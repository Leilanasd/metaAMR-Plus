name: combine_contigs_and_species
description: Combines Centrifuge classification results with contig information to produce a contig-species table
keywords:
  - centrifuge
  - metagenomics
  - taxonomy
  - contigs
tools:
  - python:
      description: General-purpose programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/
      licence: ["PSF-2.0"]
input:
  - meta:
      type: map
      description: Groovy Map containing sample information e.g. [id:'sample1']
  - centrifuge_results:
      type: file
      description: Centrifuge classification results file
      pattern: "*_centrifuge_results.txt"
  - centrifuge_report:
      type: file
      description: Centrifuge classification report file
      pattern: "*_centrifuge_report.txt"
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - contigs_species_table:
      type: file
      description: TSV file mapping contigs to their classified species
      pattern: "*_contigs_species.tsv"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@leilanasirzadeh"
