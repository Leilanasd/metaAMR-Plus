name: filter_reads_by_species
description: Filters Centrifuge classification results to extract read IDs belonging to a target species
keywords:
  - centrifuge
  - filter
  - metagenomics
  - species
tools:
  - python:
      description: General-purpose programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/
      licence: ["PSF-2.0"]
input:
  - meta:
      type: map
      description: Groovy Map containing sample information e.g. [id:'sample1']
  - centrifuge_report:
      type: file
      description: Centrifuge classification report file
      pattern: "*_centrifuge_report.txt"
  - centrifuge_results:
      type: file
      description: Centrifuge classification results file
      pattern: "*_centrifuge_results.txt"
  - target_species:
      type: string
      description: Target species name to filter reads for
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - filtered_read_ids:
      type: file
      description: Text file containing filtered read IDs for target species
      pattern: "*.filtered_reads.txt"
  - species_summary:
      type: file
      description: Summary of species classification results
      pattern: "*.species_summary.txt"
  - log:
      type: file
      description: Log file from filtering process
      pattern: "*.log"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@leilanasirzadeh"
