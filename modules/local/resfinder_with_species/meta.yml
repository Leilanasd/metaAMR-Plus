name: resfinder_with_species
description: Runs ResFinder on species-filtered reads and associates AMR genes with target species
keywords:
  - resfinder
  - AMR
  - metagenomics
  - species
tools:
  - resfinder:
      description: ResFinder identifies acquired antimicrobial resistance genes in total or partial sequenced isolates
      homepage: https://cge.food.dtu.dk/services/ResFinder/
      documentation: https://bitbucket.org/genomicepidemiology/resfinder
      licence: ["Apache-2.0"]
input:
  - meta:
      type: map
      description: Groovy Map containing sample information e.g. [id:'sample1']
  - reads:
      type: file
      description: Input reads in FASTQ or FASTA format
      pattern: "*.{fastq,fastq.gz,fasta,fa}"
  - species_info:
      type: file
      description: Species summary file from FILTER_READS_BY_SPECIES
      pattern: "*.species_summary.txt"
  - db:
      type: directory
      description: ResFinder database directory
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - amr_results:
      type: file
      description: ResFinder AMR results associated with target species
      pattern: "*.resfinder_results.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@leilanasirzadeh"
