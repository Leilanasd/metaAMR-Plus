name: plasclass_postprocess
description: Post-processes PlasClass output to classify contigs as plasmid or chromosomal based on a score threshold
keywords:
  - plasmid
  - classification
  - postprocessing
tools:
  - bash:
      description: GNU Bourne Again shell
      homepage: https://www.gnu.org/software/bash/
      licence: ["GPL-3.0-or-later"]
input:
  - meta:
      type: map
      description: Groovy Map containing sample information e.g. [id:'sample1']
  - report:
      type: file
      description: PlasClass score output file
      pattern: "*.plasclass.txt"
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - classified:
      type: file
      description: Classified contigs with plasmid or chromosome labels
      pattern: "*.plasclass_classified.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@leilanasirzadeh"
