name: input_check
description: Validates and parses the input samplesheet CSV file, creating channels for downstream processing
components: []
keywords:
  - samplesheet
  - validation
  - input
  - long-reads
input:
  - samplesheet:
      type: file
      description: CSV samplesheet file containing sample information and paths to FASTQ files
      pattern: "*.csv"
output:
  - reads:
      type: channel
      description: Channel containing sample metadata and paths to FASTQ files [ val(meta), path(reads) ]
  - versions:
      type: channel
      description: Channel containing software versions
authors:
  - "@leilanasirzadeh"
