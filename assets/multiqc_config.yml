
report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/metaamrplus/releases/tag/1.0.0" target="_blank">nf-core/metaamrplus</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/metaamrplus/1.0.0/docs/output" target="_blank">documentation</a>.
export_plots: true

disable_version_detection: true

# How MultiQC finds filtlong log files
sp:
  filtlong:
    fn: "*_filtered.log"
    contents: "Scoring long reads"
    contents_re: " "

extra_fn_clean_exts:
  - "_filtered"
  - ".assembly"
  - "_null_raw"
  - "_null"
  - "_kaiju"

# Display order for modules (top to bottom as they appear in report)
module_order:
  - fastqc
  - samtools
  - porechop
  - filtlong
  - quast
  - kraken:
      name: 'Centrifuge'
  - kaiju

# Customize section names
section_names:
  kraken: 'Centrifuge Taxonomic Classification'

# Section order (higher numbers = top, lower = bottom)
report_section_order:
  nf-core-metaamrplus-summary:
    order: -1000
  fastqc:
    order: 1000
  samtools:
    order: 900
  porechop:
    order: 800
  filtlong:
    order: 700
  quast:
    order: 600
  kraken:
    order: 500
  kaiju:
    order: 400
  "nf-core-metaamrplus-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-metaamrplus-summary":
    order: -1002